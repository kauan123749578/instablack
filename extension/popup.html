<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Instablack Sync</title>
  <style>
    :root {
      --bg: #050505;
      --card: #121212;
      --gold2: #E8D48B;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --ok: #3dba7a;
      --err: #e05a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      font: 13px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    h1 {
      margin: 0 0 2px;
      font-size: 15px;
      color: var(--gold2);
      font-weight: 700;
    }
    .sub { color: var(--muted); margin-bottom: 12px; font-size: 12px; }
    .step-now {
      background: #14110a;
      border: 1px solid #5a4a18;
      color: var(--gold2);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    label { display: block; color: var(--muted); margin: 10px 0 4px; font-size: 11px; }
    input, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    button {
      background: linear-gradient(180deg, #d4af37, #a8841a);
      color: #111;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--gold2);
      border: 1px solid var(--line);
      font-weight: 600;
    }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #0c0c0c;
      border: 1px solid var(--line);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status.ok { border-color: #2a5a40; color: var(--ok); }
    .status.err { border-color: #5a2a2a; color: var(--err); }
    .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Instablack Sync</h1>
  <div class="sub">Liga o Instagram deste Chrome no painel</div>

  <div class="step-now" id="step-now">Passo 1: cole o token e a proxy</div>

  <label>Token (do site Extensão Chrome)</label>
  <input id="token" type="text" placeholder="ibxt_…" autocomplete="off" />

  <button type="button" class="secondary" id="open-token">Não tenho token — abrir o site</button>

  <label>Proxy residencial desta conta</label>
  <input id="proxy" placeholder="ip:porta:usuario:senha" autocomplete="off" />

  <button type="button" id="push">Conectar esta conta no Instablack</button>
  <div class="hint">Tem que estar logado no Instagram neste Chrome.</div>

  <div id="status" class="status">Cole o token + proxy e aperte Conectar.</div>

  <script src="popup.js"></script>
</body>
</html>
