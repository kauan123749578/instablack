<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Instablack Sync</title>
  <style>
    :root {
      --bg: #050505;
      --card: #121212;
      --gold: #C9A227;
      --gold2: #E8D48B;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --ok: #3dba7a;
      --err: #e05a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      font: 13px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 15px;
      color: var(--gold2);
      font-weight: 700;
    }
    .sub { color: var(--muted); margin-bottom: 12px; font-size: 12px; }
    label { display: block; color: var(--muted); margin: 10px 0 4px; font-size: 11px; }
    input, select, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }
    button {
      background: linear-gradient(180deg, #d4af37, #a8841a);
      color: #111;
      border: none;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--gold2);
      border: 1px solid var(--line);
      margin-top: 8px;
      font-weight: 600;
    }
    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #0c0c0c;
      border: 1px solid var(--line);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status.ok { border-color: #2a5a40; color: var(--ok); }
    .status.err { border-color: #5a2a2a; color: var(--err); }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <h1>Instablack Sync</h1>
  <div class="sub">Manda o jar completo + dados do browser</div>

  <label>URL do painel</label>
  <input id="panel" placeholder="https://instablack-production.up.railway.app" />

  <label>Token (Contas → Extensão Chrome)</label>
  <input id="token" type="password" placeholder="ibxt_…" autocomplete="off" />

  <div class="row">
    <button type="button" class="secondary" id="save">Salvar</button>
    <button type="button" class="secondary" id="reload">Contas</button>
  </div>

  <label>Conta no Instablack</label>
  <select id="account">
    <option value="">— carregue as contas —</option>
  </select>

  <button type="button" id="push">Enviar cookies + browser</button>
  <div id="status" class="status">Pronto. Logue no Instagram neste Chrome antes de enviar.</div>

  <script src="popup.js"></script>
</body>
</html>
