<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso · instablack</title>
  <link rel="icon" href="/static/favicon-32.png?v=4" type="image/png" sizes="32x32" />
  <link rel="icon" href="/static/favicon.png?v=4" type="image/png" sizes="64x64" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=59" />
  <meta name="csrf-token" content="{{ csrf_token or request.session.get('csrf_token', '') }}" />
  <meta name="theme-color" content="#030308" />
</head>
<body class="login-body">
  <div class="ambient-grid"></div>
  <canvas class="login-rays" id="login-rays"></canvas>

  <div class="login-card login-card--premium">
    <div class="login-brand login-brand--stack">
      <div class="login-brand-icon" aria-hidden="true">
        <img src="/static/logo-ghost.png" alt="" width="56" height="56">
      </div>
      <span class="login-brand-text">instablack</span>
    </div>

    <span class="login-badge">Acesso restrito</span>
    <h1>Área privada</h1>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token or request.session.get('csrf_token', '') }}">
      <label>Usuário
        <input type="text" name="username" required autofocus autocomplete="username" placeholder="seu usuário">
      </label>
      <label>Senha
        <span class="password-field">
          <input type="password" name="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="password-toggle" id="login-password-toggle" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
            <svg class="password-toggle-icon password-toggle-icon--show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="password-toggle-icon password-toggle-icon--hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
      </label>
      <button type="submit" class="btn btn-primary login-submit">Entrar</button>
    </form>

    {% if allow_registration %}
    <p class="login-footer">Tem convite? <a href="/register">Criar acesso</a></p>
    {% endif %}
  </div>

  <script src="/static/login-fx.js?v=1"></script>
  <script>
    (function () {
      var input = document.getElementById("login-password");
      var btn = document.getElementById("login-password-toggle");
      if (input && btn) {
        btn.addEventListener("click", function () {
          var show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.setAttribute("aria-pressed", show ? "true" : "false");
          btn.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha");
          btn.setAttribute("title", show ? "Ocultar senha" : "Mostrar senha");
        });
      }
      document.addEventListener("submit", function (ev) {
        var form = ev.target;
        if (!form || form.tagName !== "FORM") return;
        var meta = document.querySelector('meta[name="csrf-token"]');
        var token = meta && meta.content ? meta.content : "";
        if (!token) return;
        var csrf = form.querySelector('input[name="csrf_token"]');
        if (!csrf) {
          csrf = document.createElement("input");
          csrf.type = "hidden";
          csrf.name = "csrf_token";
          form.appendChild(csrf);
        }
        csrf.value = token;
      }, true);
    })();
  </script>
</body>
</html>
